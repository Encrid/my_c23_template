[project]
name = "typed"

[fail.calls]
start_one = "-1"
start_two = "-1"
pthread_create = "EAGAIN"
CreateThread = "nullptr"

[targets.x86_64-windows-gnu]
threads = []

[targets.aarch64-windows-gnu]
threads = []

[targets.x86_64-linux-gnu]
threads = ["-lpthread"]

[targets.aarch64-linux-gnu]
threads = ["-lpthread"]

[targets.x86_64-macos]
threads = []

[targets.aarch64-macos]
threads = []

[[artifact]]
name = "typed"
kind = "program"
sources = ["src/*.c", "src/{system}/*.c", "tests/started.c"]
include = ["src", "tests"]
flags = ["{threads}"]

[test]
timeout = 60
copies = 1
