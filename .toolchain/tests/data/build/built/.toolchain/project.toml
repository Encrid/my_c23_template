[project]
name = "built"

[variables]
said = "written"

[kinds.stamped]
output = "{name}.txt"
steps = [
    { copy = ["{sources}", "{work}.txt"] },
    { rename = ["{work}.txt", "{output}"] },
    { section = "said", text = "{manifest:,}" },
    { contains = "{said}" },
]

[[artifact]]
name = "greet"
kind = "library"
sources = ["src/greet.c"]
include = ["include"]
defines = ['GREETING="hello from a library"']

[[artifact]]
name = "greeter"
kind = "program"
folder = "greeter"
sources = ["src/greeter.c", "src/{system}/*.c"]
include = ["include", "src"]
link = ["{out}/greet{library}"]
beside = ["{out}/greet{library}"]

[[artifact]]
name = "stamped"
kind = "stamped"
sources = ["src/note.txt"]
manifest = ["first", "second"]
variants = [{ name = "plain", unstamped = true }]

[test]
timeout = 60
copies = 1
