[[case]]
name = "test --branches reaches the branch of each failed call"
run = ["{python}", "{root}/.toolchain/tools/test.py", "--root", "{root}/.toolchain/tests/data/fail/failed", "--out", "{case}/out", "--branches"]
claims = { status = 0, line = ["branches: 19 outcomes, 19 reached"] }
false = { run = ["{python}", "{root}/.toolchain/tools/test.py", "--root", "{root}/.toolchain/tests/data/fail/failed", "--out", "{case}/out", "--branches", "-k", "whole"] }

[[case]]
name = "test --leaks counts the path of a failed call"
run = ["{python}", "{root}/.toolchain/tools/test.py", "--root", "{root}/.toolchain/tests/data/fail/failed", "--out", "{case}/out", "--leaks", "-k", "leaky"]
claims = { status = 1, line = ["leaks: leaky keeps 1 memory"] }
false = { run = ["{python}", "{root}/.toolchain/tools/test.py", "--root", "{root}/.toolchain/tests/data/fail/failed", "--out", "{case}/out", "--leaks", "-k", "second"] }

[[case]]
name = "a failed call takes nothing in test --leaks"
run = ["{python}", "{root}/.toolchain/tools/test.py", "--root", "{root}/.toolchain/tests/data/fail/failed", "--out", "{case}/out", "--leaks", "-k", "second"]
claims = { status = 0, line = ["second: as written", "leaks: 1 cases, 1 give back what they take"] }
false = { run = ["{python}", "{root}/.toolchain/tools/test.py", "--root", "{root}/.toolchain/tests/data/fail/failed", "--out", "{case}/out", "--leaks", "-k", "leaky"] }
