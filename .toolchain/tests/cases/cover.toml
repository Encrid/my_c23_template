[[case]]
name = "a type that a macro makes"
run = ["{python}", "{root}/.toolchain/tools/cover.py", "--root", "{case}/p"]
files = { "{case}/p/.toolchain/project.toml" = "[check.makes]\nSAMPLE_MAKE_TYPE = \"\"\n", "{case}/p/include/sample.h" = "#define SAMPLE_POINT_FIELDS { int x; }\nSAMPLE_MAKE_TYPE(sample_point_t, SAMPLE_POINT_FIELDS);\n", "{case}/p/docs/extern/sample.h.md" = "# include/sample.h\n\n`SAMPLE_POINT_FIELDS` gives `x`.\n" }
claims = { status_not = 0, has = ["include/sample.h: sample_point_t is not in docs/extern/sample.h.md"] }
false = { files = { "{case}/p/docs/extern/sample.h.md" = "# include/sample.h\n\n`SAMPLE_POINT_FIELDS` gives `x` to `sample_point_t`.\n" } }

[[case]]
name = "a descriptor that a macro makes"
run = ["{python}", "{root}/.toolchain/tools/cover.py", "--root", "{case}/p"]
files = { "{case}/p/.toolchain/project.toml" = "[check.makes]\nSAMPLE_MAKE_DESC = \"_desc\"\n", "{case}/p/include/sample.h" = "#define SAMPLE_KIND_VALUES { SAMPLE_ONE = 1 }\nSAMPLE_MAKE_DESC(sample_kind_t, uint32_t, SAMPLE_KIND_VALUES);\n", "{case}/p/docs/extern/sample.h.md" = "# include/sample.h\n\n`SAMPLE_KIND_VALUES` gives `SAMPLE_ONE`.\n" }
claims = { status_not = 0, has = ["include/sample.h: sample_kind_t_desc is not in docs/extern/sample.h.md"] }
false = { files = { "{case}/p/docs/extern/sample.h.md" = "# include/sample.h\n\n`SAMPLE_KIND_VALUES` gives `SAMPLE_ONE` to `sample_kind_t_desc`.\n" } }

[[case]]
name = "a call of a macro that [check.makes] does not name gives no name"
run = ["{python}", "{root}/.toolchain/tools/cover.py", "--root", "{case}/p"]
files = { "{case}/p/.toolchain/project.toml" = "[check.makes]\nSAMPLE_MAKE_DESC = \"_desc\"\n", "{case}/p/include/sample.h" = "#define SAMPLE_POINT_FIELDS { int x; }\nSAMPLE_MAKE_TYPE(sample_point_t, SAMPLE_POINT_FIELDS);\n", "{case}/p/docs/extern/sample.h.md" = "# include/sample.h\n\n`SAMPLE_POINT_FIELDS` gives `x`.\n" }
claims = { status = 0, line = ["no fault in 1 files"] }
false = { files = { "{case}/p/.toolchain/project.toml" = "[check.makes]\nSAMPLE_MAKE_TYPE = \"\"\n" } }

