[[case]]
name = "a join makes one zip with a folder for each target"
run = ["{python}", "-c", "import subprocess, sys, zipfile; tool, root, out, *targets = sys.argv[1:]; [subprocess.run([sys.executable, tool, '--root', root, '--out', out, '--pack', '--part', 'alpha', '--target', target], check=True, capture_output=True) for target in targets]; subprocess.run([sys.executable, tool, '--root', root, '--out', out, '--join', '--part', 'alpha'], check=True); print('\\n'.join(zipfile.ZipFile(out + '/Family-Alpha.zip').namelist()))", "{root}/.toolchain/tools/build.py", "{root}/.toolchain/tests/data/build/family", "{case}/out", "x86_64-windows-gnu", "x86_64-linux-gnu", "aarch64-macos", "aarch64-linux-gnu", "x86_64-macos", "aarch64-windows-gnu"]
claims = { status = 0, line = ["{case}/out/Family-Alpha.zip", "x86_64-windows-gnu/alpha.txt", "x86_64-linux-gnu/alpha.txt", "aarch64-macos/alpha.txt", "aarch64-linux-gnu/alpha.txt", "x86_64-macos/alpha.txt", "aarch64-windows-gnu/alpha.txt", "aarch64-windows-gnu/include/alpha.h", "aarch64-windows-gnu/third_party/sample/license"] }
false = { run = ["{python}", "-c", "import subprocess, sys, zipfile; tool, root, out, *targets = sys.argv[1:]; [subprocess.run([sys.executable, tool, '--root', root, '--out', out, '--pack', '--part', 'alpha', '--target', target], check=True, capture_output=True) for target in targets]; subprocess.run([sys.executable, tool, '--root', root, '--out', out, '--join', '--part', 'alpha'], check=True); print('\\n'.join(zipfile.ZipFile(out + '/Family-Alpha.zip').namelist()))", "{root}/.toolchain/tools/build.py", "{root}/.toolchain/tests/data/build/family", "{case}/out", "x86_64-windows-gnu", "x86_64-linux-gnu", "aarch64-macos", "aarch64-linux-gnu", "x86_64-macos"] }

