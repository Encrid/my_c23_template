files = { "{case}/p/.toolchain/project.toml" = "[project]\nname = \"p\"\n\n[parts.a]\nname = \"A\"\nuses = []\nuse = []\nthird_party = []\n\n[[artifact]]\nname = \"note\"\nkind = \"file\"\npart = \"a\"\nsources = [\"note.txt\"]\n", "{case}/p/note.txt" = "note\n" }
claims = { status_not = 0, has = ["[parts.a]: a part has no key use"] }
false = { files = { "{case}/p/.toolchain/project.toml" = "[project]\nname = \"p\"\n\n[parts.a]\nname = \"A\"\nuses = []\nthird_party = []\n\n[[artifact]]\nname = \"note\"\nkind = \"file\"\npart = \"a\"\nsources = [\"note.txt\"]\n" } }

[[case]]
name = "a pack of a part writes the zip of the part"
run = ["{python}", "{root}/.toolchain/tools/build.py", "--root", "{root}/.toolchain/tests/data/build/family", "--out", "{case}/out", "--pack", "--part", "beta"]
claims = { status = 0, line = ["{case}/out/Family-Beta-{target}.zip", "beta.txt", "include/beta.h", "license", "package proof: Family-Beta ran"], matches_not = ["(?m)^alpha[.]txt$", "(?m)^third_party/"] }
false = { run = ["{python}", "{root}/.toolchain/tools/build.py", "--root", "{root}/.toolchain/tests/data/build/family", "--out", "{case}/out", "--pack", "--part", "alpha"] }

