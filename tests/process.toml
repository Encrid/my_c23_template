[[case]]
name = "a script"
run = ["{out}/fixtures/ask{exe}", "{case}/note.txt"]
script = [{ wait = "? name", put = { "{case}/note.txt" = "note" }, type = "you" }]
claims = { status = 0, order = ["hello, you", "written at the prompt"], files = { "{case}/note.txt" = "written at the prompt" } }
false = { script = [{ wait = "? name", type = "nobody" }] }

[[case]]
name = "a helper"
run = ["{out}/main{exe}"]
claims = { status = 0, line = ["hello, c23"] }
helper = { run = ["{out}/fixtures/ask{exe}"], wait = "? name", stdin = "helper\n", claims = { status = 0, line = ["hello, helper"] } }

[[case]]
name = "a variable of the environment, given"
run = ["{out}/fixtures/env{exe}", "C23_SAID"]
env = { C23_SAID = "port {port}" }
claims = { status = 0, line = ["port {port}"] }
false = { env = {} }

[[case]]
name = "a variable of the environment, taken away"
run = ["{out}/fixtures/env{exe}", "ZIG_LOCAL_CACHE_DIR"]
env = { ZIG_LOCAL_CACHE_DIR = false }
claims = { status = 0, line = ["unset"] }
false = { env = {} }
