[[case]]
name = "a fault of the style"
run = ["{python}", "{root}/tools/style.py", "--root", "{case}/p"]
claims = { status = 1, has = ["src/a.c:1: G1 the file does not start with the legal notice", "faults: 1"] }

[case.files]
"{case}/p/project.toml" = '''
[project]
owner = "Enkrid"
licence = "Under the licence of the case."
'''
"{case}/p/src/a.c" = ""

[case.false.files]
"{case}/p/src/a.c" = '''
/*
** Copyright (C) 2026 Enkrid
**
** Under the licence of the case.
*/
'''

[[case]]
name = "an exception"
run = ["{python}", "{root}/tools/style.py", "--root", "{case}/p"]
claims = { status = 0, line = ["no fault in 1 files"] }

[case.files]
"{case}/p/project.toml" = '''
[project]
owner = "Enkrid"
licence = "Under the licence of the case."

[[style.exception]]
rule = "G1"
path = "src/a.c"
why = "The case needs a file with no legal notice."
'''
"{case}/p/src/a.c" = ""

[case.false.files]
"{case}/p/project.toml" = '''
[project]
owner = "Enkrid"
licence = "Under the licence of the case."
'''

[[case]]
name = "an exception for one function"
run = ["{python}", "{root}/tools/style.py", "--root", "{case}/p"]
claims = { status = 0, line = ["no fault in 1 files"] }

[case.files]
"{case}/p/project.toml" = '''
[project]
owner = "Enkrid"
licence = "Under the licence of the case."

[[style.exception]]
rule = "F4"
path = "src/a.c:long_one"
why = "The case needs a long function."
'''
"{case}/p/src/a.c" = '''
/*
** Copyright (C) 2026 Enkrid
**
** Under the licence of the case.
*/
static int long_one(void)
{
    int n = 0;

    n++;
    n++;
    n++;
    n++;
    n++;
    n++;
    n++;
    n++;
    n++;
    n++;
    n++;
    n++;
    n++;
    n++;
    n++;
    n++;
    n++;
    n++;
    return (n);
}
'''

[case.false.files]
"{case}/p/project.toml" = '''
[project]
owner = "Enkrid"
licence = "Under the licence of the case."

[[style.exception]]
rule = "F4"
path = "src/a.c:short_one"
why = "The case needs a long function."
'''

[[case]]
name = "an exception that excuses nothing"
run = ["{python}", "{root}/tools/style.py", "--root", "{case}/p"]
claims = { status = 1, has = ["project.toml:1: F4 the exception for 'src/a.c' excuses nothing"] }

[case.files]
"{case}/p/project.toml" = '''
[project]
owner = "Enkrid"
licence = "Under the licence of the case."

[[style.exception]]
rule = "F4"
path = "src/a.c"
why = "The case needs a long function."
'''
"{case}/p/src/a.c" = '''
/*
** Copyright (C) 2026 Enkrid
**
** Under the licence of the case.
*/
'''

[case.false.files]
"{case}/p/src/a.c" = '''
