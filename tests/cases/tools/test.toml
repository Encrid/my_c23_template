[[case]]
name = "a script"
run = ["{python}", "-c", "import sys; print('? name', flush=True); print('hello, ' + input()); print(open(sys.argv[1]).read())", "{case}/note.txt"]
script = [{ wait = "? name", put = { "{case}/note.txt" = "tests/data/tools/test/note.txt" }, type = "you" }]
claims = { status = 0, order = ["hello, you", "written at the prompt"], files = { "{case}/note.txt" = "written at the prompt" } }
false = { script = [{ wait = "? name", type = "nobody" }] }

[[case]]
name = "a helper"
run = ["{python}", "-c", "import sys; print(open(sys.argv[1]).read())", "{case}/said.txt"]
helper = { run = ["{python}", "-c", "import sys; open(sys.argv[1], 'w').write('hello, helper'); print('written', flush=True); input()", "{case}/said.txt"], wait = "written", stdin = "\n", claims = { status = 0 } }
claims = { status = 0, line = ["hello, helper"] }
false = { helper = {} }

[[case]]
name = "a variable of the environment, given"
run = ["{python}", "-c", "import os, sys; print(os.environ.get(sys.argv[1], 'unset'))", "C23_SAID"]
env = { C23_SAID = "port {port}" }
claims = { status = 0, line = ["port {port}"] }
false = { env = {} }

[[case]]
name = "a variable of the environment, taken away"
run = ["{python}", "-c", "import os, sys; print(os.environ.get(sys.argv[1], 'unset'))", "ZIG_LOCAL_CACHE_DIR"]
env = { ZIG_LOCAL_CACHE_DIR = false }
claims = { status = 0, line = ["unset"] }
false = { env = {} }

[[case]]
name = "claims on the status and on the output"
run = ["{python}", "-c", "import sys; print('one ' + input()); sys.exit(3)"]
stdin = "two\n"
claims = { status = 3, status_not = 0, has = ["one two"], lacks = ["three"] }
false = { stdin = "three\n" }

[[case]]
name = "a script that removes a file"
run = ["{python}", "-c", "import os, sys; print('? gone', flush=True); input(); print(os.path.exists(sys.argv[1]))", "{case}/gone.txt"]
files = { "{case}/gone.txt" = "here" }
script = [{ wait = "? gone", remove = ["{case}/gone.txt"], type = "go" }]
claims = { status = 0, line = ["False"] }
false = { script = [{ wait = "? gone", type = "go" }] }

[[case]]
name = "a folder of files"
run = ["{python}", "-c", "import sys; print(open(sys.argv[1]).read())", "{case}/in/note.txt"]
folders = { "{case}/in" = ["tests/data/tools/test/note.txt"] }
claims = { status = 0, line = ["written at the prompt"] }
false = { folders = { "{case}/in" = [] } }

[[case]]
name = "a case with no false variant"
run = ["{python}", "{root}/tools/test.py", "--root", "{case}", "--out", "{case}/out"]
folders = { "{case}" = ["tests/data/tools/test/project.toml"], "{case}/tests/cases" = ["tests/data/tools/test/alone.toml"] }
claims = { status_not = 0, has = ["tests/cases/alone.toml: the case alone has no false variant"] }
false = { folders = { "{case}/tests/cases" = ["tests/data/tools/test/passes.toml"] } }

[[case]]
name = "a case that claims nothing"
run = ["{python}", "{root}/tools/test.py", "--root", "{case}", "--out", "{case}/out"]
folders = { "{case}" = ["tests/data/tools/test/project.toml"], "{case}/tests/cases" = ["tests/data/tools/test/silent.toml"] }
claims = { status_not = 0, has = ["tests/cases/silent.toml: the case silent claims nothing"] }
false = { folders = { "{case}/tests/cases" = ["tests/data/tools/test/passes.toml"] } }

[[case]]
name = "a case with a key that no case has"
run = ["{python}", "{root}/tools/test.py", "--root", "{case}", "--out", "{case}/out"]
folders = { "{case}" = ["tests/data/tools/test/project.toml"], "{case}/tests/cases" = ["tests/data/tools/test/colour.toml"] }
claims = { status_not = 0, has = ["tests/cases/colour.toml: a case has no key colour"] }
false = { folders = { "{case}/tests/cases" = ["tests/data/tools/test/passes.toml"] } }

[[case]]
name = "a case that differs"
run = ["{python}", "{root}/tools/test.py", "--root", "{case}", "--out", "{case}/out"]
folders = { "{case}" = ["tests/data/tools/test/project.toml"], "{case}/tests/cases" = ["tests/data/tools/test/fails.toml"] }
claims = { status_not = 0, has = ["fails: differs", "  ended with 1 (0x00000001), and printed:", "not as written: fails"] }
false = { folders = { "{case}/tests/cases" = ["tests/data/tools/test/passes.toml"] } }

[[case]]
name = "a case that does not end in time"
run = ["{python}", "{root}/tools/test.py", "--root", "{case}", "--out", "{case}/out"]
folders = { "{case}" = ["tests/data/tools/test/late/project.toml"], "{case}/tests/cases" = ["tests/data/tools/test/late.toml"] }
claims = { status_not = 0, has = ["late: did not end in 2 seconds", "not as written: late"] }
false = { folders = { "{case}/tests/cases" = ["tests/data/tools/test/passes.toml"] } }

[[case]]
name = "a rule of the tests"
run = ["{python}", "{root}/tools/test.py", "--root", "{case}", "--out", "{case}/out"]
folders = { "{case}" = ["tests/data/tools/test/ruled/project.toml"], "{case}/tests/cases/free" = ["tests/data/tools/test/said.toml"], "{case}/tests/cases/held" = ["tests/data/tools/test/said.toml"] }
claims = { status_not = 0, has = ["free/said: 1 cases: 1 as written", "held/said: 1 cases: 0 as written"] }
false = { folders = { "{case}/tests/cases/held" = ["tests/data/tools/test/passes.toml"] } }

[[case]]
name = "no case"
run = ["{python}", "{root}/tools/test.py", "--root", "{case}", "--out", "{case}/out"]
folders = { "{case}" = ["tests/data/tools/test/project.toml"] }
claims = { status = 0, line = ["no case: tests/cases holds no case"] }
false = { folders = { "{case}/tests/cases" = ["tests/data/tools/test/passes.toml"] } }

[[case]]
name = "a false variant that still holds"
run = ["{python}", "{root}/tools/test.py", "--root", "{case}", "--out", "{case}/out", "--break"]
folders = { "{case}" = ["tests/data/tools/test/project.toml"], "{case}/tests/cases" = ["tests/data/tools/test/still.toml"] }
claims = { status_not = 0, has = ["still as written with their claims made false: still"] }
false = { folders = { "{case}/tests/cases" = ["tests/data/tools/test/passes.toml"] } }

[[case]]
name = "a target that does not run here"
run = ["{python}", "{root}/tools/test.py", "--root", "{case}", "--out", "{case}/out", "--target", "aarch64-windows-gnu"]
folders = { "{case}" = ["tests/data/tools/test/project.toml"] }
claims = { status_not = 0, has = ["aarch64-windows-gnu does not run here: build it, and test it where it runs"] }
false = { run = ["{python}", "{root}/tools/test.py", "--root", "{case}", "--out", "{case}/out"] }

[[case]]
name = "a case that needs what is not linked"
run = ["{python}", "{root}/tools/test.py", "--root", "{case}", "--out", "{case}/out"]
folders = { "{case}" = ["tests/data/tools/test/later/project.toml"] }
claims = { status_not = 0, has = ["compiled, not linked: later: ", "the cases need what is linked: later"] }
false = { files = { "{case}/linked.txt" = "here" } }
