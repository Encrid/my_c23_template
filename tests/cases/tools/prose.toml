[[case]]
name = "sections out of order"
run = ["{python}", "{root}/tools/prose.py", "--root", "{case}"]
files = { "{case}/project.toml" = "[project]\nname = \"sample\"\n", "{case}/readme.md" = "# sample\n\nA sample.\n\n## Usage\n\nUse it.\n\n## Install\n\nInstall it.\n\n## Contributing\n\nRead the rules.\n\n## License\n\nThe licence.\n" }
claims = { status = 1, line = ["readme.md:9: the section Install must come before Usage"] }
false = { files = { "{case}/readme.md" = "# sample\n\nA sample.\n\n## Install\n\nInstall it.\n\n## Usage\n\nUse it.\n\n## Contributing\n\nRead the rules.\n\n## License\n\nThe licence.\n" } }

[[case]]
name = "a section that the readme needs"
run = ["{python}", "{root}/tools/prose.py", "--root", "{case}"]
files = { "{case}/project.toml" = "[project]\nname = \"sample\"\n", "{case}/readme.md" = "# sample\n\nA sample.\n\n## Install\n\nInstall it.\n\n## Usage\n\nUse it.\n\n## Contributing\n\nRead the rules.\n" }
claims = { status = 1, line = ["readme.md:1: no section License"] }
false = { files = { "{case}/readme.md" = "# sample\n\nA sample.\n\n## Install\n\nInstall it.\n\n## Usage\n\nUse it.\n\n## Contributing\n\nRead the rules.\n\n## License\n\nThe licence.\n" } }
