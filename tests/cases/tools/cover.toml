[[case]]
name = "a function that its document does not name"
run = ["{python}", "{root}/tools/cover.py", "--root", "{case}/p"]
files = { "{case}/p/include/sample.h" = "int sample_add(int a, int b);\n", "{case}/p/docs/extern/include/sample.h.md" = "# include/sample.h\n", "{case}/p/tests/cases/sample.toml" = "[[case]]\nname = \"sample_add gives the sum\"\n" }
claims = { status_not = 0, has = ["include/sample.h: sample_add is not in docs/extern/include/sample.h.md"] }
false = { files = { "{case}/p/docs/extern/include/sample.h.md" = "# include/sample.h\n\n`sample_add(a, b)` gives the sum.\n" } }

