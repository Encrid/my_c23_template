[[case]]
name = "every check"
run = ["{python}", "{root}/tools/check.py", "--root", "{root}"]
claims = { status = 0, order = ["layout.py", "text.py", "prose.py", "pseudo.py", "xref.py", "cover.py", "licence.py", "commits.py", "style.py", "c23.py", "every check passes"] }
false = { run = ["{python}", "{root}/tools/check.py", "--root", "{case}"] }

[[case]]
name = "a range of commits"
run = ["{python}", "{root}/tools/check.py", "--root", "{root}", "--commits", "nothing..nowhere"]
claims = { status = 1, line = ["check.py: failed: commits"] }
false = { run = ["{python}", "{root}/tools/check.py", "--root", "{root}"] }

[[case]]
name = "a tool that is not there"
run = ["{python}", "{case}/tools/check.py", "--root", "{case}"]
folders = { "{case}/tools" = ["tools/check.py", "tools/shared.py", "tools/toolchain.toml"] }
claims = { status = 1, line = ["check.py: failed: layout text prose pseudo xref cover licence commits style c23"] }
false = { run = ["{python}", "{root}/tools/check.py", "--root", "{case}"] }
