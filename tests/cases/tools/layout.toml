[[case]]
name = "a full project"
run = ["{python}", "{root}/tools/layout.py", "--root", "{case}/project"]
claims = { status = 0, line = ["no fault in 38 files"] }
false = { files = { "{case}/project/notes.txt" = "" } }

[case.files]
"{case}/project/.github/workflows/ci.yml" = ""
"{case}/project/.github/workflows/release.yml" = ""
"{case}/project/.github/workflows/cla.yml" = ""
"{case}/project/.github/pull_request_template.md" = ""
"{case}/project/.gitattributes" = ""
"{case}/project/.gitignore" = ""
"{case}/project/cla.md" = ""
"{case}/project/license" = ""
"{case}/project/project.py" = ""
"{case}/project/project.toml" = "[layout]\npublic = [\"share\"]\n"
"{case}/project/readme.md" = ""
"{case}/project/docs/contributing.md" = ""
"{case}/project/tools/check.py" = ""
"{case}/project/tools/toolchain.toml" = ""
"{case}/project/src/sample.c" = ""
"{case}/project/src/os/os.h" = ""
"{case}/project/src/os/posix/os.c" = ""
"{case}/project/src/os/windows/os.c" = ""
"{case}/project/include/sample.h" = ""
"{case}/project/share/sample.toml" = ""
"{case}/project/tests/cases/sample.toml" = ""
"{case}/project/tests/fixtures/ask/ask.c" = ""
"{case}/project/third_party/sample/fix.patch" = ""
"{case}/project/third_party/sample/license" = ""
"{case}/project/tests/data/Any Name.txt" = ""
"{case}/project/docs/intern/project.py.md" = "# project.py\n"
"{case}/project/docs/extern/project.py.md" = "# project.py\n"
"{case}/project/docs/extern/project.toml.md" = "# project.toml\n"
"{case}/project/docs/intern/tools/check.py.md" = "# tools/check.py\n"
"{case}/project/docs/intern/tools/toolchain.toml.md" = "# tools/toolchain.toml\n"
"{case}/project/docs/intern/src/sample.c.md" = "# src/sample.c\n"
"{case}/project/docs/intern/src/os/os.h.md" = "# src/os/os.h\n"
"{case}/project/docs/intern/src/os/posix/os.c.md" = "# src/os/posix/os.c\n"
"{case}/project/docs/intern/src/os/windows/os.c.md" = "# src/os/windows/os.c\n"
"{case}/project/docs/extern/include/sample.h.md" = "# include/sample.h\n"
"{case}/project/docs/extern/share/sample.toml.md" = "# share/sample.toml\n"
"{case}/project/docs/intern/tests/cases/sample.toml.md" = "# tests/cases/sample.toml\n"
"{case}/project/docs/intern/tests/fixtures/ask/ask.c.md" = "# tests/fixtures/ask/ask.c\n"
"{case}/project/docs/intern/third_party/sample/fix.patch.md" = "# third_party/sample/fix.patch\n"

[[case]]
name = "a path that the layout does not allow"
run = ["{python}", "{root}/tools/layout.py", "--root", "{case}/project"]
files = { "{case}/project/project.toml" = "", "{case}/project/notes.txt" = "" }
claims = { status = 1, line = ["notes.txt: the layout does not allow this file"] }
false = { run = ["{python}", "{root}/tools/layout.py", "--root", "{case}/fixed"], files = { "{case}/fixed/project.toml" = "" } }

[[case]]
name = "a file that the layout needs"
run = ["{python}", "{root}/tools/layout.py", "--root", "{case}/project"]
files = { "{case}/project/project.toml" = "" }
claims = { status = 1, line = ["license: the layout needs this file"] }
false = { files = { "{case}/project/license" = "" } }

[[case]]
name = "the folders that the layout needs"
run = ["{python}", "{root}/tools/layout.py", "--root", "{case}/project"]
files = { "{case}/project/project.toml" = "" }
claims = { status = 1, line = ["src/: the layout needs this folder", "tests/cases/: the layout needs this folder", "tools/: the layout needs this folder"] }
false = { files = { "{case}/project/src/a.c" = "", "{case}/project/tests/cases/a.toml" = "", "{case}/project/tools/a.py" = "" } }

[[case]]
name = "a source without its document"
run = ["{python}", "{root}/tools/layout.py", "--root", "{case}/project"]
files = { "{case}/project/project.toml" = "", "{case}/project/src/a.c" = "" }
claims = { status = 1, line = ["src/a.c: no document docs/intern/src/a.c.md"] }
false = { files = { "{case}/project/docs/intern/src/a.c.md" = "# src/a.c\n" } }

[[case]]
name = "a public header without its document"
run = ["{python}", "{root}/tools/layout.py", "--root", "{case}/project"]
files = { "{case}/project/project.toml" = "", "{case}/project/include/a.h" = "" }
claims = { status = 1, line = ["include/a.h: no document docs/extern/include/a.h.md"] }
false = { files = { "{case}/project/docs/extern/include/a.h.md" = "# include/a.h\n" } }

[[case]]
name = "a file of a public folder without its document"
run = ["{python}", "{root}/tools/layout.py", "--root", "{case}/project"]
files = { "{case}/project/project.toml" = "[layout]\npublic = [\"share\"]\n", "{case}/project/share/a.toml" = "" }
claims = { status = 1, line = ["share/a.toml: no document docs/extern/share/a.toml.md"] }
false = { files = { "{case}/project/docs/extern/share/a.toml.md" = "# share/a.toml\n" } }

[[case]]
name = "a public folder that is a folder of the layout"
run = ["{python}", "{root}/tools/layout.py", "--root", "{case}/project"]
files = { "{case}/project/project.toml" = "[layout]\npublic = [\"tests\", \"src\"]\n" }
claims = { status_not = 0, has = ["[layout] public names a folder of the layout: src tests"] }
false = { files = { "{case}/project/project.toml" = "[layout]\npublic = [\"share\"]\n" } }

[[case]]
name = "a document without its file"
run = ["{python}", "{root}/tools/layout.py", "--root", "{case}/project"]
files = { "{case}/project/project.toml" = "", "{case}/project/docs/intern/src/gone.c.md" = "# src/gone.c\n" }
claims = { status = 1, line = ["docs/intern/src/gone.c.md: no file has this document"] }
false = { files = { "{case}/project/src/gone.c" = "" } }

[[case]]
name = "a document in the wrong folder"
run = ["{python}", "{root}/tools/layout.py", "--root", "{case}/project"]
files = { "{case}/project/project.toml" = "", "{case}/project/src/a.c" = "", "{case}/project/docs/intern/src/a.c.md" = "# src/a.c\n", "{case}/project/docs/extern/src/a.c.md" = "# src/a.c\n" }
claims = { status = 1, line = ["docs/extern/src/a.c.md: no file has this document"] }
false = { run = ["{python}", "{root}/tools/layout.py", "--root", "{case}/fixed"], files = { "{case}/fixed/project.toml" = "", "{case}/fixed/src/a.c" = "", "{case}/fixed/docs/intern/src/a.c.md" = "# src/a.c\n" } }

[[case]]
name = "a file of docs that is not a document"
run = ["{python}", "{root}/tools/layout.py", "--root", "{case}/project"]
files = { "{case}/project/project.toml" = "", "{case}/project/docs/notes.txt" = "" }
claims = { status = 1, line = ["docs/notes.txt: no file has this document"] }
false = { run = ["{python}", "{root}/tools/layout.py", "--root", "{case}/fixed"], files = { "{case}/fixed/project.toml" = "" } }

[[case]]
name = "the first line of a document"
run = ["{python}", "{root}/tools/layout.py", "--root", "{case}/project"]
files = { "{case}/project/project.toml" = "", "{case}/project/src/a.c" = "", "{case}/project/docs/intern/src/a.c.md" = "# a.c\n" }
claims = { status = 1, line = ["docs/intern/src/a.c.md: the first line is not # src/a.c"] }
false = { files = { "{case}/project/docs/intern/src/a.c.md" = "# src/a.c\n" } }

[[case]]
name = "a name that is not in snake_case"
run = ["{python}", "{root}/tools/layout.py", "--root", "{case}/project"]
files = { "{case}/project/project.toml" = "", "{case}/project/src/Notes.c" = "" }
claims = { status = 1, line = ["src/Notes.c: 'Notes.c' is not in snake_case"] }
false = { run = ["{python}", "{root}/tools/layout.py", "--root", "{case}/fixed"], files = { "{case}/fixed/project.toml" = "", "{case}/fixed/src/notes.c" = "" } }

[[case]]
name = "a compiled file"
run = ["{python}", "{root}/tools/layout.py", "--root", "{case}/project"]
files = { "{case}/project/project.toml" = "", "{case}/project/src/sample.o" = "" }
claims = { status = 1, line = ["src/sample.o: a compiled or temporary file"] }
false = { run = ["{python}", "{root}/tools/layout.py", "--root", "{case}/fixed"], files = { "{case}/fixed/project.toml" = "", "{case}/fixed/src/sample.c" = "" } }

[[case]]
name = "a system that no target has"
run = ["{python}", "{root}/tools/layout.py", "--root", "{case}/project"]
files = { "{case}/project/project.toml" = "", "{case}/project/src/os/linux/os.c" = "" }
claims = { status = 1, line = ["src/os/linux/os.c: the layout does not allow this file"] }
false = { run = ["{python}", "{root}/tools/layout.py", "--root", "{case}/fixed"], files = { "{case}/fixed/project.toml" = "", "{case}/fixed/src/os/posix/os.c" = "" } }

[[case]]
name = "a file of tests/data"
run = ["{python}", "{root}/tools/layout.py", "--root", "{case}/project"]
files = { "{case}/project/project.toml" = "", "{case}/project/tests/data/Any Name.txt" = "" }
claims = { status = 1, lacks = ["Any Name.txt"] }
false = { run = ["{python}", "{root}/tools/layout.py", "--root", "{case}/fixed"], files = { "{case}/fixed/project.toml" = "", "{case}/fixed/tests/Any Name.txt" = "" } }
